name: Deploy VSTEP Speaking Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build single-file website
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          parts = []
          for i in range(1, 13):
              p = Path(f"site/part{i:02d}.txt")
              parts.append(p.read_text(encoding="utf-8").strip())
          payload = "".join(parts)
          html = gzip.decompress(base64.b64decode(payload)).decode("utf-8")

          out = Path("_site")
          out.mkdir(exist_ok=True)
          (out / "index.html").write_text(html, encoding="utf-8")
          (out / ".nojekyll").write_text("", encoding="utf-8")

          print(f"Built index.html: {len(html):,} characters")
          assert "VSTEP" in html
          assert "big-mic-btn" in html
          assert "scoreResponse" in html
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
